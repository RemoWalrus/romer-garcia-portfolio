[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

# Proxy Supabase Edge Functions through our domain
[[redirects]]
  from = "/api/*"
  to = "https://xxigtbxqgbdcfpmnrzvp.supabase.co/functions/v1/:splat"
  status = 200
  force = true

# Keep Lovable-hosted assets out of the SPA fallback
[[redirects]]
  from = "/__l5e/*"
  to = "/__l5e/:splat"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
