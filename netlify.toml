[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

# Reverb routes are pre-rendered at build time (scripts/prerender-reverb.mjs)
# into dist/reverb/**/index.html, so crawlers get real meta tags and JSON-LD in
# the raw HTML. Those files are served directly — no forced rewrite here, or it
# would shadow them. Unknown /reverb/* paths fall through to the SPA fallback.


# Proxy Supabase Edge Functions through our domain
[[redirects]]
  from = "/api/*"
  to = "https://xxigtbxqgbdcfpmnrzvp.supabase.co/functions/v1/:splat"
  status = 200
  force = true

# Lovable-hosted assets (posters, wallpapers) are not part of the Netlify build
# output, so proxy them to the Lovable CDN instead of falling through to the SPA.
[[redirects]]
  from = "/__l5e/*"
  to = "https://romer-garcia-portfolio.lovable.app/__l5e/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
